# strucmed form-app（H0）：app 在 /，三個院內服務同源反向代理。瀏覽器只看到 http://localhost:<port>，
# api/v2 不需要 CORS；表單頁（api/v2/forms/{id}/page）依 X-Forwarded-Proto／Host 組 <base>，可經代理載入。
# ${UPSTREAM} 由容器環境變數代入（nginx 官方映像的 envsubst），例如 https://<站台>。
# 注意：LLM／語音由表單頁向 /llmgw 呼叫；請在 LlmGateway 登記 APP（回呼 http://localhost:<port>/）走 PKCE 取得 token。
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # PWA：index.html 不快取，hash 資產長快取
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }

    # 院內站台（strucmed 整合站台、LlmGateway、FMapi）
    location /strucmed/ { include /etc/nginx/conf.d/proxy-common.inc; proxy_pass ${UPSTREAM}/strucmed/; }
    location /llmgw/    { include /etc/nginx/conf.d/proxy-common.inc; proxy_pass ${UPSTREAM}/llmgw/; proxy_buffering off; proxy_read_timeout 300s; }
    location /FM/       { include /etc/nginx/conf.d/proxy-common.inc; proxy_pass ${UPSTREAM}/FM/; }
}
